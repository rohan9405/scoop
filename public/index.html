<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118"><meta name="description" content="Scoop, your personal dashboard for your Fitbit data. Sleep, activity, and health metrics in one place.">
<title>Scoop · Your daily performance</title>
<link rel="icon" type="image/svg+xml" href="/assets/scoop-mark.svg"><link rel="apple-touch-icon" href="/assets/scoop-mark.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar">
<a href="#overview" class="wordmark" aria-label="Scoop home"><img class="wordmark-full" src="/assets/scoop-logo.svg" alt="SCOOP"><img class="wordmark-mark" src="/assets/scoop-infinity.svg" alt=""></a>
<div class="workspace-label">YOUR PERFORMANCE</div>
<nav id="navigation" aria-label="Main navigation"></nav>
<div class="sidebar-bottom">
<div class="account-card" id="account-card"></div>
</div>
</aside>
<div class="main-shell">
<header class="topbar"><button class="icon-button menu-button" data-action="open-drawer" aria-label="Open menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><a href="#overview" class="topbar-logo" aria-label="Scoop home"><img class="logo-full" src="/assets/scoop-logo.svg" alt="SCOOP"><img class="logo-mark" src="/assets/scoop-infinity.svg" alt=""></a><div class="breadcrumb"><strong id="breadcrumb">OVERVIEW</strong></div>
<div class="date-pill" role="group" aria-label="Choose day"><button data-action="previous-day" aria-label="Previous day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button id="date-pill-label" class="date-pill-label" data-action="calendar">TODAY</button><button id="date-pill-next" data-action="next-day" aria-label="Next day"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
<div class="topbar-right"><span id="data-badge" class="data-badge" hidden></span><button class="device-chip" id="device-chip" data-action="device" aria-label="Device details"><span class="chip-text"><span class="chip-pct">—</span><span class="chip-sync"></span></span><svg class="device-icon" viewBox="0 0 24 32" aria-hidden="true"><path class="strap" d="M8 1h8M8 31h8"/><rect class="body" x="4" y="5" width="16" height="22" rx="6"/><rect class="fill" x="7" y="8" width="10" height="16" rx="3.5"/><circle class="pulse" cx="20" cy="5" r="3.2"/></svg></button></div></header>
<main id="main" tabindex="-1"></main>
<footer class="footer"><span>BUILT AROUND YOUR BODY.</span><span>Your personal Fitbit dashboard · <button data-action="about">About the data</button></span></footer>
</div>
<div class="scrim" data-action="close-drawer" aria-hidden="true"></div>
<button class="fab" data-action="fab" aria-label="Quick actions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
<nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile navigation"></nav>
</div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body></html>
